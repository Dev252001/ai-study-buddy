# Alembic configuration for Study Buddy
# Generated by alembic init; customised to use app settings.

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Template used to generate migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path additions for env.py
prepend_sys_path = .

# Timezone for %%(year)d etc. in file_template (defaults to UTC)
# timezone =

# Max length of characters to apply to the %%(slug)s variable
truncate_slug_length = 40

# Set to 'true' to run in --sql mode by default
sql = false

# Set to 'true' to start the transaction before calling environment's run_migrations
transaction_per_migration = false

# Set to 'true' to force the environment's migration transaction to be independent
# of the transaction of the current alembic command
independent_migrations = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
sourceless = false

# Version path separator; 'os', 'space', 'newline', 'colon', ';', ':'
version_path_separator = os

# Set to 'true' to search source files recursively
# in each "version_locations" directory
# New in Alembic version 1.10
# recursive_version_locations = false

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# database URL is read from app settings at runtime; do NOT hardcode here.
sqlalchemy.url = postgresql://study_buddy:study_buddy@localhost:5432/study_buddy


[post_write_hooks]
# Uncomment to run ruff on generated migrations:
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
